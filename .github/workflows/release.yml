name: Release

# Runs for stable version tags (v1.2.3), no matter whether the tag was pushed (git / GitHub
# Desktop) or created together with a release on the GitHub website.
# Tags that do not point to a commit on main fail before anything is built or signed, so nothing
# from the dev branch can ever become an update.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    # RELEASE_SIGNING_KEY lives in this environment; restrict it to tags matching v*.
    environment: release
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify the tag is a stable release on main
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a stable release tag (vX.Y.Z)"; exit 1
          fi
          git fetch --no-tags origin main
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::Tag $TAG points to $commit, which is not on main. Merge the pull request into main first and tag the merge commit."
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Test
        run: |
          go vet ./...
          go test ./... 2>&1 | tee test.log; status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '^\s*--- FAIL|^\s+[a-z_]+_test\.go:[0-9]+:' test.log | head -n 40 | while IFS= read -r line; do
              echo "::error::$(echo "$line" | sed 's/^[[:space:]]*//')"
            done
          fi
          exit "$status"

      - name: Build
        run: |
          VERSION="${TAG#v}"
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.Version=$VERSION" \
              -o "dist/lgsm-dashboard-linux-$arch" .
          done
          test "$(./dist/lgsm-dashboard-linux-amd64 -version)" = "$VERSION"
          (cd dist && sha256sum lgsm-dashboard-linux-* > SHA256SUMS)

      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          go run ./tools/releasekey check-embedded -file main.go -file install-dashboard.sh
          go run ./tools/releasekey sign -in dist/SHA256SUMS -out dist/SHA256SUMS.sig

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Release was created on the website: keep its text, attach the signed files.
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG"
          fi

      - name: Keep the signed binaries for the container image
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # Publishes ghcr.io/<owner>/linuxgsm-dashboard with exactly the signed release binaries.
  # Disabled until the repository variable PUBLISH_DOCKER_IMAGE is set to "true", so no image is
  # published before the Docker mode is ready.
  docker:
    needs: release
    if: vars.PUBLISH_DOCKER_IMAGE == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Verify the binaries against the signed checksums
        run: (cd dist && sha256sum -c SHA256SUMS)

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/linuxgsm-dashboard
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
